name: Post hazırla

on:
  schedule:
    # 04:30 UTC = 08:30 Bakı, iş günləri
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      style:
        description: "Üslub (analyst | practitioner | provocateur)"
        required: false
        default: ""

concurrency:
  group: avtopost-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Baku' }}
      MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '1' }}
      MIN_HOURS_BETWEEN_POSTS: ${{ vars.MIN_HOURS_BETWEEN_POSTS || '6' }}
      TOPIC_SELECTION: ${{ vars.TOPIC_SELECTION || '1' }}
      AUTO_PICK_HOURS: ${{ vars.AUTO_PICK_HOURS || '3' }}
      PUBLISH_HOUR: ${{ vars.PUBLISH_HOUR || '12' }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Sağlamlıq siqnalı — başladı
        if: env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 "$HEALTHCHECK_URL/start" > /dev/null

      # Testlər əvvəl işləyir: sınıq kodla kvota yandırmağın mənası yoxdur
      - name: Testlər
        run: python3 -m unittest discover -s tests -q

      - name: Dayandırılıb?
        id: guard
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Baku' }}
        run: |
          if [ -f state/settings.json ] && grep -q '"paused": *true' state/settings.json; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "⏸ Sistem dayandırılıb (/pause) — atlanır."
            exit 0
          fi
          # Lokal ehtiyat artıq hazırlayıbsa təkrar etmirik.
          # GitHub cron gecikdikdə lokal launchd işə düşür; CI sonradan
          # gələndə ikinci namizəd dəsti göndərməməlidir.
          if [ "$(python3 -c "from src import proposals; print(proposals.prepared_today())")" = "True" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "✓ Bu gün artıq hazırlanıb (lokal ehtiyat) — atlanır."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post + şəkil hazırla
        id: build
        if: steps.guard.outputs.paused == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_BUDGET_USD: ${{ vars.RESEARCH_BUDGET_USD || '0.45' }}
          AGENT_BUDGET_USD: ${{ vars.AGENT_BUDGET_USD || '0.25' }}
        run: |
          set +e
          if [ "${TOPIC_SELECTION:-1}" = "1" ]; then
            # Namizədlər göndərilir, post seçimdən SONRA yazılır
            python3 -m src.cli propose --notify-empty
          else
            python3 -m src.cli run --image --commit --notify-empty
          fi
          code=$?
          set -e
          # 5 = uyğun xəbər tapılmadı. Nasazlıq deyil: yayım bankdan olacaq.
          if [ $code -eq 5 ]; then
            echo "no_news=true" >> "$GITHUB_OUTPUT"
            echo "🔕 Uyğun xəbər tapılmadı — bank rejimi."
            exit 0
          fi
          echo "no_news=false" >> "$GITHUB_OUTPUT"
          exit $code


      # Kart Notion-da dərhal görünsün (tick saatda bir işləyir)
      - name: Notion sinxronizasiyası
        if: steps.guard.outputs.paused == 'false' && steps.build.outputs.no_news == 'false'
        continue-on-error: true
        run: python3 -m src.cli notion-sync

      - name: Vəziyyəti saxla
        if: always()
        run: ./scripts/commit_state.sh "post hazırlandı"

      - name: Sağlamlıq siqnalı — uğur
        if: success() && env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 "$HEALTHCHECK_URL" > /dev/null

      - name: Sağlamlıq siqnalı — uğursuzluq
        if: failure() && env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 "$HEALTHCHECK_URL/fail" > /dev/null

      - name: Xəta bildirişi
        if: failure()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=HTML \
            --data-urlencode "text=⚠️ <b>Post hazırlanmadı</b>%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
