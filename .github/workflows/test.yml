name: Testlər

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "out/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow (şəkil testləri üçün)
        run: python3 -m pip install --quiet pillow
      - name: Oflayn testlər
        run: python3 -m unittest discover -s tests -v
      - name: Sintaksis yoxlaması
        run: python3 -m compileall -q src scripts auth
