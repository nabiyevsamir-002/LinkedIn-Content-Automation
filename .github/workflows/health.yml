name: Həftəlik yoxlama

on:
  schedule:
    # Bazar ertəsi 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Baku' }}
      PUBLISH_HOUR: ${{ vars.PUBLISH_HOUR || '12' }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_EXPIRES_AT: ${{ secrets.LINKEDIN_EXPIRES_AT }}
      LINKEDIN_PROFILE_NAME: ${{ secrets.LINKEDIN_PROFILE_NAME }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202509' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Real API-lar hələ işləyirmi? LinkedIn versiyası, Telegram formatı,
      # RSS mənbələri — bunlar bizdən asılı olmadan dəyişir.
      - name: İnteqrasiya sınağı
        continue-on-error: true
        run: python3 -m src.cli smoke --send

      - name: Həftəlik hesabat
        run: python3 -m src.cli report --send
